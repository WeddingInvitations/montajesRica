runtime: python311
instance_class: F1
entrypoint: gunicorn -b :$PORT app:app

automatic_scaling:
  min_instances: 0
  max_instances: 2
  max_concurrent_requests: 10

env_variables:
  APP_ENV: production
  USE_FIRESTORE: "false"

handlers:
  - url: /static
    static_dir: static
    secure: always
  - url: /.*
    script: auto
    secure: always
